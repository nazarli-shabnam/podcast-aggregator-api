[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-aggregator-api"
version = "0.1.0"
description = "Podcast Data Aggregation and RESTful API Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-redis",
    "psycopg[binary]>=3.1",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults
    "UP046",  # keep Generic[T] base for Pydantic v2 generic models
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point (S101); bind-all / hardcoded dummy creds are fine.
"tests/**" = ["S101", "S105", "S106", "S104", "S311"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "defusedxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorator is untyped upstream; everything else stays strict.
module = ["app.tasks.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The module-level Redis client (app/core/redis.py) mirrors production - one
# client for the process lifetime - so tests need one event loop for the
# whole session rather than a fresh loop per test tearing down its connection.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/core/logging.py", "app/cli.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "\\.\\.\\."]
